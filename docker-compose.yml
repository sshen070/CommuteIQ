services:
  collector:
    build: .
    image: commuteiq-collector

    # API keys come from .env; they are never baked into the image
    env_file: .env
    environment:
      DB_PATH: /app/data/commute.db
      TZ: America/Los_Angeles     # log timestamps in local time

    # SQLite file lives on the host so it survives rebuilds
    volumes:
      - ./data:/app/data

    # Forward stop signals to Python so shutdown is immediate
    init: true

    # systemd (deploy/commuteiq.service) owns starting, stopping and restarting
    restart: "no"
